name: Release

# Push a version tag (e.g. v1.0.0) to build the Windows app and publish it
# as a GitHub Release with the installer and portable exe attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          name: Nebula Share ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/NebulaShare-Setup-*.exe
            dist/NebulaShare-Portable-*.exe
          fail_on_unmatched_files: true
